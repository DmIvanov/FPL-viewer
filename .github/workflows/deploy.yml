name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install
        
      - name: Build TypeScript
        run: npm run build
        
      - name: List dist contents
        run: |
          echo "=== Contents of dist folder ==="
          ls -la dist/
          echo "=== Contents of dist/css ==="
          ls -la dist/css/ || echo "No css folder"
          echo "=== Contents of dist/images ==="
          ls -la dist/images/ || echo "No images folder"
          echo "=== Contents of dist/data/cache ==="
          ls -la dist/data/cache/ || echo "No cache folder"
          echo "=== First 20 lines of dist/index.html ==="
          head -20 dist/index.html
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
