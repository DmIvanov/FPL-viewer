<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPL Test Page</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .header { background: #37003c; color: white; padding: 20px; text-align: center; }
        .test { padding: 20px; border: 1px solid #ccc; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="header">
        <h1>FPL Test Page</h1>
    </div>
    
    <div class="test">
        <h2>Basic Test</h2>
        <p>If you can see this, HTML is working.</p>
    </div>
    
    <div class="test">
        <h2>JavaScript Test</h2>
        <p id="js-test">JavaScript not loaded</p>
    </div>
    
    <script>
        document.getElementById('js-test').textContent = 'JavaScript is working!';
        console.log('Test page loaded successfully');
    </script>
</body>
</html>
